[project]
name = "chamber-rehearsal"
version = "0.1.0"
description = "A string trio that follows you at the piano: the engine's reference, and tools for the iPad app"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
rehearsal = "rehearsal.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rehearsal"]
