[project]
name = "chamber-rehearsal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "partitura>=1.9.0",
    "pyfluidsynth>=1.4.0",
    "pymatchmaker>=0.3.0",
    "python-rtmidi>=1.5.8",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
    "verovio>=6.3.0",
    "vosk==0.3.42",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
